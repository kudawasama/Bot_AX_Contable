# Integración continua — Bot AX Contable
#
# POR QUÉ EXISTE (riesgo R-4 del plan de implementación):
#   La suite de pruebas estuvo rota (hallazgo C-1) durante semanas sin que nadie
#   lo notara, porque no existía ninguna verificación automática. Este workflow
#   ejecuta la suite en cada push y cada pull request para que una regresión
#   nunca vuelva a pasar desapercibida.
#
# POR QUÉ WINDOWS:
#   El bot automatiza el escritorio de Windows (PyAutoGUI). Las dependencias
#   reales de producción (PyAutoGUI, PyGetWindow, MouseInfo) solo se instalan en
#   Windows, así que el runner refleja el entorno real de operación.
#
# NOTA IMPORTANTE: la suite es hermética. `tests/conftest.py` inyecta dobles
# inertes de `pyautogui` y `pytesseract` ANTES de importar el código del bot, por
# lo que no se necesita pantalla, mouse ni el binario de Tesseract en el runner.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruebas:
    name: Pruebas unitarias (Python 3.12)
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de producción y desarrollo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ejecutar la suite de pruebas
        run: python -m pytest -q

      - name: Humo del chequeo de salud
        # En CI no existen logs/ ni registro_*.txt (están en .gitignore), así que el
        # objetivo es verificar que la herramienta arranca y devuelve JSON válido,
        # no evaluar salud real.
        run: python scripts/chequeo_salud.py --json

  lint:
    name: Lint (ruff)
    runs-on: windows-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ruff
        run: python -m pip install ruff

      - name: Analizar src/, tests/ y scripts/
        # Puerta OBLIGATORIA (lote C, C3): el proyecto quedó limpio (0 avisos) con el
        # ruleset fijado en pyproject.toml, así que ya no lleva `--exit-zero` ni
        # continue-on-error. El ruleset es explícito (E, F, I, W), así que una versión
        # nueva de ruff no puede introducir reglas sorpresivas: si este paso se pone
        # rojo, es porque un cambio introdujo un aviso real.
        run: python -m ruff check src/ tests/ scripts/ --output-format=concise
